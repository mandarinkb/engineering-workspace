# APISIX โหมด traditional (route เก็บใน etcd) พร้อม Admin API และ dashboard ในตัว
# ดู docs/adr/0003-apisix-gateway-with-etcd-and-dashboard.md
#
# ไฟล์นี้เป็น template: __APISIX_ADMIN_KEY__ ถูกแทนด้วยค่าจากตัวแปร env APISIX_ADMIN_KEY ตอน container เริ่ม
# (ดู entrypoint ใน docker-compose.yml) ค่าจริงของ key ต้องไม่อยู่ใน repo
# โหมดไฟล์ (config.yaml + apisix.yaml) ยังคงอยู่สำหรับ gateway เดิมและชุด dev
apisix:
  node_listen: 9080

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    # บังคับใช้ key ทุกคำขอ Admin API: ใครแก้ route ได้ = ปิดการตรวจ session ของ Temporal UI ได้
    admin_key_required: true
    admin_key:
      - name: admin
        key: __APISIX_ADMIN_KEY__
        role: admin
    # คำขอที่ผ่านพอร์ตที่ publish ของ Docker จะมาจาก IP ของ bridge network (172.16.0.0/12)
    # ไม่ใช่ 127.0.0.1 จึงต้องอนุญาตช่วงนี้ ส่วนการจำกัดว่าเข้าได้จากโฮสต์เท่านั้น
    # ทำที่ docker-compose.yml ด้วยการ publish เป็น 127.0.0.1:9180
    allow_admin:
      - 127.0.0.0/8
      - 172.16.0.0/12
    admin_listen:
      ip: 0.0.0.0
      port: 9180
    enable_admin_ui: true
  etcd:
    host:
      - "http://etcd:2379"
    prefix: /apisix
    timeout: 30
