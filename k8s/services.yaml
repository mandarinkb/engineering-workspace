apiVersion: v1
kind: Service
metadata: { name: bop-api, namespace: bop-system }
spec:
  selector: { app: bop-api }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: bop-dashboard, namespace: bop-system }
spec:
  selector: { app: bop-dashboard }
  ports: [{ port: 80, targetPort: 3000 }]
