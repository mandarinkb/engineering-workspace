# docker-compose.yml สำหรับรัน Temporal server + UI ใน local dev เท่านั้น
#
# ขอบเขตตั้งใจไว้แคบมาก: มีแค่สิ่งที่ Temporal เองต้องการ (server + UI + PostgreSQL
# ของ Temporal เอง) ไม่ได้ containerize ตัว BOP app (cmd/bop, cmd/bop-worker) เอง — ไฟล์นี้
# มีไว้ให้รัน `go run ./cmd/bop` และ `go run ./cmd/bop-worker` ตรงๆ บนเครื่อง (เร็วกว่า
# rebuild image ทุกครั้งที่แก้โค้ดตอนกำลัง develop) ถ้าอยากรันทั้ง BOP เป็น container จริง
# (bop-api/bop-worker/bop-dashboard ด้วย ไม่ใช่แค่ Temporal) ดู docker-compose.yml ที่ root
# ของ workspace แทน — มี Dockerfile ของทั้ง 3 component แล้วตั้งแต่ KUBERNETES-DEPLOYMENT-TODO.md
#
# PostgreSQL ตัวนี้เป็น instance แยกต่างหาก ใช้เก็บ event history ภายในของ Temporal
# เองเท่านั้น (ไม่เกี่ยวกับ PostgreSQL ที่ BOP จะใช้เก็บ job history เองใน Phase 0.4)
services:
  postgresql:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # temporalio/auto-setup รวม Temporal server ทุก component (frontend/history/matching/
  # worker service) ไว้ใน image เดียว พร้อมสร้าง schema + namespace "default" ให้อัตโนมัติ
  # ตอน container เริ่มครั้งแรก — เหมาะกับ local dev มากกว่าแยก image ทีละ service เอง
  temporal:
    image: temporalio/auto-setup:1.29.3 # pin ตรงกับ docker-compose.yml ที่ root
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
    ports:
      # gRPC endpoint ที่ Temporal Go SDK (client.Dial) เชื่อมต่อ bind แค่ localhost เพราะ Temporal
      # ไม่มีการยืนยันตัวตน (ticket 05) `go run` บนโฮสต์เดียวกันยังต่อ localhost:7233 ได้
      - "127.0.0.1:7233:7233"

  temporal-ui:
    image: temporalio/ui:2.58.1 # pin ตรงกับ docker-compose.yml ที่ root
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    # ไม่ publish พอร์ตออกนอก network: ทางเข้าเดียวคือ temporal-ui-gateway (ADR 0002)
    expose:
      - "8080"

  # ด่านหน้า Temporal UI: ให้เฉพาะผู้ที่ login BOP เข้าได้ ใช้ config ชุดเดียวกับ docker-compose.yml ที่ root
  # (ไฟล์อยู่ที่ ../../docker/temporal-ui-gateway) ชุด dev นี้ไม่มี bop-api ใน compose (รันด้วย
  # `go run ./cmd/bop` บนเครื่องโฮสต์ที่พอร์ต 8080) จึงแมปชื่อ bop-api ที่ config เรียกให้ชี้ไปที่โฮสต์
  temporal-ui-gateway:
    image: apache/apisix:3.21.0-debian # pin ตรงกับ docker-compose.yml ที่ root
    depends_on:
      - temporal-ui
    extra_hosts:
      - "bop-api:host-gateway"
    volumes:
      - ../../docker/temporal-ui-gateway/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ../../docker/temporal-ui-gateway/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "8233:9080" # เปิดดูที่ http://localhost:8233 (ต้องรัน bop-api และ login dashboard ก่อน)

volumes:
  temporal-postgres:
